  - { n: -2, en: Your parents compared you with your cousin who got into medicine, fa: مامان‌بابات تو رو با دخترخاله‌ت که پزشکی قبول شده مقایسه کردن }
  - { n: -2, en: You spent hours planning your major choices before even taking the exam, fa: هنوز کنکور ندادی ولی ساعت‌ها نشستی انتخاب رشته‌ت رو چیدی }
  - { n: -3, en: 'Your "quick nap" lasted until dinner', fa: «چرت کوتاهت» تا وقت شام طول کشید }
  - { n: -1, en: You translated an Arabic sentence into something completely different, fa: یه جمله‌ی عربی رو ترجمه کردی و یه معنی دیگه دراومد }
  - { n: -2, en: 'You opened the group "just for a peek" and you''re still here', fa: گروه رو باز کردی «فقط یه نگاه» و هنوز اینجایی }
  - { n: -2, en: 'You went to a café to study and only the coffee got finished', fa: 'رفتی کافه درس بخونی و فقط قهوه‌ت تموم شد' }
  - { n: -1, en: 'You watched "how to study ten hours a day" and fell asleep', fa: 'ویدیوی «چطوری روزی ده ساعت درس بخونیم» رو دیدی و خوابت برد' }
  - { n: -2, en: 'A friend said "I haven''t studied either" and you relaxed. He was lying', fa: 'دوستت گفت «منم هیچی نخوندم» و خیالت راحت شد. دروغ می‌گفت' }
