  - { en: 'You said "just one episode" and watched the whole season', fa: گفتی «فقط یه قسمت» و کل فصل رو دیدی }
  - { en: You got lost in konkur Telegram channels, fa: تو کانال‌های تلگرامی کنکور گم شدی }
  - { en: You guessed and got negative marks, fa: شانسی زدی و نمره‌ی منفی خوردی }
  - { en: The neighbor's kid got a better mock-exam rank, fa: بچه‌ی همسایه تو آزمون آزمایشی رتبه‌ی بهتری آورد }
