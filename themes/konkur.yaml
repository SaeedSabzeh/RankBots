# Konkur bot: improve your konkur rank. Lower is better, and ranks move in thousands.
# Messages are written without numbers; the engine adds ": −3,000" after them
# (a rank has no unit, so it's just the number).
# Farsi copy is a first draft for Simin to review.

name: konkur
emoji: "📚"
# fa, en, or both. "both" sends every message in Farsi and then English.
language: fa
# Time between two /play turns. One study session: 2 hours.
cooldown_minutes: 120

bot_name:
  en: Konkur Bot
  fa: ربات کنکور
tagline:
  en: Get the best konkur rank in the group. Lower is better!
  fa: بهترین رتبه‌ی کنکور گروه رو بگیر. هرچی کمتر، بهتر!
leaderboard_title:
  en: Top ranks in the group
  fa: رتبه‌برترهای گروه

score:
  name: { en: Konkur rank, fa: رتبه‌ی کنکور }
  # A rank is just a number.
  unit: { en: "", fa: "" }
  start: 500000
  direction: lower
  # Every rolled point moves the rank by 1,000.
  scale: 1000
  # Rank 1 is as good as it gets.
  min: 1

gains:
  - { en: You finished a whole Gaj test book, fa: یه کتاب تست گاج رو کامل زدی }
  - { en: You studied all day without touching your phone, fa: کل روز بدون دست زدن به گوشی درس خوندی }
  - { en: You finally understood integrals, fa: بالاخره انتگرال رو فهمیدی }
  - { en: You crushed the mock exam, fa: تو آزمون آزمایشی ترکوندی }
  - { en: You deleted Instagram for a week, fa: یه هفته اینستاگرام رو پاک کردی }
  - { en: Your study plan actually worked, fa: برنامه‌ی مطالعاتیت واقعاً جواب داد }
  - { en: You memorized all the Arabic grammar, fa: کل قواعد عربی رو حفظ کردی }
  - { en: You woke up at dawn to study, fa: سحر بیدار شدی درس بخونی }
  - { en: You read the Kheili Sabz biology book cover to cover, fa: زیست خیلی سبز رو از اول تا آخرش خوندی }
  - { en: Your taraz went up in the Ghalamchi exam, fa: ترازت تو آزمون قلم‌چی رفت بالا }
  - { en: You left the hard questions blank instead of guessing, fa: سؤال‌های سخت رو به‌جای شانسی زدن سفید گذاشتی }
  - { en: 'Your advisor said "keep going just like this"', fa: مشاورت گفت «همین‌جوری ادامه بده» }
  - { en: 'You solved a physics question your teacher couldn''t', fa: یه تست فیزیک رو حل کردی که معلمتون نتونست }
  - { en: You finally got the hang of literary devices, fa: بالاخره آرایه‌های ادبی دستت اومد }
  - { en: You memorized the whole periodic table, fa: جدول تناوبی رو کامل از بر کردی }
  - { en: You muted every Telegram group except this one, fa: همه‌ی گروه‌های تلگرام رو میوت کردی جز همین یکی }
  - { en: Your konkur-class teacher taught you a test-taking shortcut, fa: استاد کلاس کنکور یه روش تستی خفن یادت داد }
  - { en: You sat in the library all day and didn't budge, fa: کل روز تو کتابخونه نشستی و جم نخوردی }
  - { en: You analyzed your wrong answers instead of just checking your score, fa: به‌جای اینکه فقط نمره‌ت رو ببینی غلط‌هات رو تحلیل کردی }
  - { en: Your mom brought tea and fruit to your desk, fa: مامانت برات چای و میوه آورد سر میز درس }
  - { en: You topped your class in the Gozine Do mock exam, fa: تو آزمون گزینه دو اول کلاس شدی }
  - { en: You finally finished the stoichiometry chapter, fa: بالاخره فصل استوکیومتری شیمی رو تموم کردی }
