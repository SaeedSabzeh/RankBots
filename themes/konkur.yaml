neutral:
  - { en: You opened the book and stared at the first page, fa: کتاب رو باز کردی و به صفحه‌ی اول زل زدی }
  - { en: You highlighted everything in yellow, fa: همه‌چیز رو با ماژیک زرد هایلایت کردی }
  - { en: You tidied your desk and admired it instead of studying, fa: میز تحریرت رو مرتب کردی و نشستی به تماشاش }
  - { en: You read the same paragraph again and again, fa: یه پاراگراف رو هی خوندی و هنوز مطمئن نیستی چی گفت }
  - { en: You asked your advisor for tips and heard the usual speech, fa: از مشاورت راهنمایی خواستی و همون حرف‌های همیشگی رو شنیدی }

# Rare events (5% of rolls) replace the normal roll with a big swing.
events:
  good:
    - { en: You got into Sharif, fa: شریف قبول شدی }
    - { en: The answer key had a mistake and it went your way, fa: کلید سؤال‌ها اشتباه داشت و به نفع تو شد }
    - { en: Every single guess you made was right, fa: همه‌ی شانسی‌هات درست دراومد }
    - { en: You got into medicine at the University of Tehran, fa: پزشکی دانشگاه تهران قبول شدی }
    - { en: Your name made the national top-ranks list, fa: اسمت تو لیست رتبه‌برترهای کشور اومد }
    - { en: The konkur had exactly the questions you studied the night before, fa: سؤال‌های کنکور دقیقاً همونایی بود که شب قبلش خونده بودی }
    - { en: TV interviewed you as a top ranker, fa: تلویزیون به‌عنوان رتبه‌برتر باهات مصاحبه کرد }
    - { en: The neighbor's kid came to you for study advice, fa: بچه‌ی همسایه اومد ازت مشاوره گرفت }
  bad:
    - { en: You filled in the answer sheet one row off, fa: پاسخ‌نامه رو یه ردیف جابه‌جا پر کردی }
    - { en: You overslept on konkur day, fa: روز کنکور خواب موندی }
    - { en: Your pencil broke and you had no spare, fa: مدادت شکست و یدک نداشتی }
    - { en: You realized you spent the whole year on the old textbooks, fa: فهمیدی کل سال کتاب‌های چاپ قدیم رو خوندی }
    - { en: You entered the wrong codes when choosing your majors, fa: تو انتخاب رشته کدها رو اشتباه وارد کردی }
    - { en: The air conditioning broke down in the exam hall, fa: کولر حوزه‌ی امتحانی وسط کنکور خراب شد }
    - { en: You went to the wrong exam center on konkur day, fa: روز کنکور رفتی یه حوزه‌ی دیگه }
    - { en: You left your exam entry card at home, fa: کارت ورود به جلسه‌ت رو خونه جا گذاشتی }

# Lower is better: each title is reached once the rank is at or below `at`.
titles:
  - { at: 500000, name: { en: Retaking the konkur 😴, fa: پشت‌کنکوری 😴 } }
  - { at: 300000, name: { en: Finally getting serious 📖, fa: تازه جدی شده 📖 } }
  - { at: 150000, name: { en: Mock-exam regular 📝, fa: پای ثابت آزمون آزمایشی 📝 } }
  - { at: 50000, name: { en: State university material 🏫, fa: در حد دانشگاه سراسری 🏫 } }
  - { at: 10000, name: { en: Top of the class 🎓, fa: شاگرد اول کلاس 🎓 } }
  - { at: 2000, name: { en: Medicine in Tehran 🩺, fa: پزشکی تهران 🩺 } }
  - { at: 100, name: { en: Sharif genius 🧠, fa: نابغه‌ی شریف 🧠 } }
