  - { en: A friend sent a voice message saying "just one quick question" and it ate your whole evening, fa: دوستت یه ویس فرستاد که «فقط یه سؤال کوتاه» و کل عصرت رفت }
  - { en: Your parents compared you with your cousin who got into medicine, fa: مامان‌بابات تو رو با دخترخاله‌ت که پزشکی قبول شده مقایسه کردن }
