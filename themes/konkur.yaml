# Konkur bot: improve your konkur rank. Lower is better, and ranks move in thousands.
# Messages are written without numbers; the engine adds ": −3,000" after them
# (a rank has no unit, so it's just the number).
# Farsi copy is a first draft for Simin to review.

name: konkur
emoji: "📚"
# fa, en, or both. "both" sends every message in Farsi and then English.
language: fa
# Time between two /play turns. One study session: 2 hours.
cooldown_minutes: 120

bot_name:
  en: Konkur Bot
  fa: ربات کنکور
tagline:
  en: Get the best konkur rank in the group. Lower is better!
  fa: بهترین رتبه‌ی کنکور گروه رو بگیر. هرچی کمتر، بهتر!
leaderboard_title:
  en: Top ranks in the group
  fa: رتبه‌برترهای گروه

score:
  name: { en: Konkur rank, fa: رتبه‌ی کنکور }
  # A rank is just a number.
  unit: { en: "", fa: "" }
  start: 500000
  direction: lower
  # Every rolled point moves the rank by 1,000.
  scale: 1000
  # Rank 1 is as good as it gets.
  min: 1

gains:
  - { n: 8, en: You finished a whole Gaj test book, fa: یه کتاب تست گاج رو کامل زدی }
  - { n: 5, en: You studied all day without touching your phone, fa: کل روز بدون دست زدن به گوشی درس خوندی }
  - { n: 6, en: You finally understood integrals, fa: بالاخره انتگرال رو فهمیدی }
  - { n: 8, en: You crushed the mock exam, fa: تو آزمون آزمایشی ترکوندی }
  - { n: 5, en: You deleted Instagram for a week, fa: یه هفته اینستاگرام رو پاک کردی }
  - { n: 4, en: Your study plan actually worked, fa: برنامه‌ی مطالعاتیت واقعاً جواب داد }
  - { n: 6, en: You memorized all the Arabic grammar, fa: کل قواعد عربی رو حفظ کردی }
  - { n: 3, en: You woke up at dawn to study, fa: سحر بیدار شدی درس بخونی }
  - { n: 9, en: You read the Kheili Sabz biology book cover to cover, fa: زیست خیلی سبز رو از اول تا آخرش خوندی }
  - { n: 6, en: Your taraz went up in the Ghalamchi exam, fa: ترازت تو آزمون قلم‌چی رفت بالا }
  - { n: 2, en: You left the hard questions blank instead of guessing, fa: سؤال‌های سخت رو به‌جای شانسی زدن سفید گذاشتی }
  - { n: 2, en: 'Your advisor said "keep going just like this"', fa: مشاورت گفت «همین‌جوری ادامه بده» }
  - { n: 7, en: 'You solved a physics question your teacher couldn''t', fa: یه تست فیزیک رو حل کردی که معلمتون نتونست }
