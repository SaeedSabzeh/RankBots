  - { n: -2, en: You got lost in konkur Telegram channels, fa: تو کانال‌های تلگرامی کنکور گم شدی }
  - { n: -3, en: You guessed and got negative marks, fa: شانسی زدی و نمره‌ی منفی خوردی }
  - { n: -1, en: The neighbor's kid got a better mock-exam rank, fa: بچه‌ی همسایه تو آزمون آزمایشی رتبه‌ی بهتری آورد }
  - { n: -2, en: 'You fell asleep on your chemistry book and woke up with the periodic table on your cheek', fa: 'رو کتاب شیمی خوابت برد و صبح جدول تناوبی رو لپت چاپ شده بود' }
