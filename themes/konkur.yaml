  - { en: You took a full timed practice exam with a real answer sheet, fa: یه آزمون کامل با تایمر و پاسخ‌نامه‌ی واقعی زدی }
  - { en: You stopped comparing yourself with the neighbor's kid, fa: دیگه خودت رو با بچه‌ی همسایه مقایسه نکردی }

