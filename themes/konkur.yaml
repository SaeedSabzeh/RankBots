  - { n: 5, en: You memorized the whole periodic table, fa: جدول تناوبی رو کامل از بر کردی }
  - { n: 3, en: You muted every Telegram group except this one, fa: همه‌ی گروه‌های تلگرام رو میوت کردی جز همین یکی }
  - { n: 3, en: Your konkur-class teacher taught you a test-taking shortcut, fa: استاد کلاس کنکور یه روش تستی خفن یادت داد }
  - { n: 5, en: You sat in the library all day and didn't budge, fa: کل روز تو کتابخونه نشستی و جم نخوردی }
  - { n: 4, en: You analyzed your wrong answers instead of just checking your score, fa: به‌جای اینکه فقط نمره‌ت رو ببینی غلط‌هات رو تحلیل کردی }
  - { n: 1, en: Your mom brought tea and fruit to your desk, fa: مامانت برات چای و میوه آورد سر میز درس }
  - { n: 7, en: You topped your class in the Gozine Do mock exam, fa: تو آزمون گزینه دو اول کلاس شدی }
  - { n: 6, en: You finally finished the stoichiometry chapter, fa: بالاخره فصل استوکیومتری شیمی رو تموم کردی }
  - { n: 3, en: You explained a lesson to a friend and understood it better yourself, fa: درس رو برای دوستت توضیح دادی و خودت بهتر فهمیدی }
  - { n: 5, en: You took a full timed practice exam with a real answer sheet, fa: یه آزمون کامل با تایمر و پاسخ‌نامه‌ی واقعی زدی }
