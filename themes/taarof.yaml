    - { en: 'Walks you to the end of the street', fa: 'تا سر کوچه بدرقه‌ت می‌کنه' }
    - { en: 'Refuses three times, then takes one', fa: 'سه بار رد می‌کنه، بعد برمی‌داره' }
    - { en: 'Model host', fa: 'میزبان نمونه' }
    - { en: 'Polite guest', fa: 'مهمون باادب' }
