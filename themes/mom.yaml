# Mom approval bot: grow your mom's approval. The leaderboard is "Favorite child".
# Messages are written without numbers; the engine adds ": +9 pts" after them.
# Farsi copy is a first draft for Simin to review.

name: mom
emoji: "💖"
# fa, en, or both. "both" sends every message in Farsi and then English.
language: fa
# Time between two /play turns. Mom's mood can change in half an hour.
cooldown_minutes: 30

bot_name:
  en: Mom Approval Bot
  fa: ربات تأیید مامان
tagline:
  en: Become mom's favorite child. Your siblings are watching.
  fa: بچه‌ی محبوب مامان شو. خواهر برادرات دارن نگاه می‌کنن.
leaderboard_title:
  en: Favorite child
  fa: بچه‌ی محبوب مامان

score:
  name: { en: Mom's approval, fa: تأیید مامان }
  unit: { en: pts, fa: امتیاز }
  start: 0
  direction: higher
  scale: 1
  min: 0

gains:
  - { n: 4, en: You called just to ask how she's doing, fa: فقط زنگ زدی حالش رو بپرسی }
  - { n: 4, en: You finished your plate and asked for seconds, fa: کل غذات رو خوردی و دوباره کشیدی }
  - { n: 3, en: You wore the jacket she told you to wear, fa: همون کاپشنی که گفت رو پوشیدی }
  - { n: 4, en: You finally brought back her Tupperware, fa: بالاخره ظرف‌هاش رو پس آوردی }
  - { n: 7, en: 'You said "you were right"', fa: گفتی «حق با تو بود» }
  - { n: 6, en: You washed the dishes without being asked, fa: بی‌اینکه بگه ظرف‌ها رو شستی }
  - { n: 1, en: You sent her a good-morning flower picture, fa: براش عکس گل صبح‌بخیر فرستادی }
  - { n: 5, en: Her friends said what a polite kid you are, fa: دوستاش گفتن چه بچه‌ی مؤدبی داری }
  - { n: 6, en: You sat and cleaned sabzi with her for an hour, fa: یه ساعت نشستی باهاش سبزی پاک کردی }
  - { n: 4, en: You took the trash out the first time she asked, fa: همون بار اول که گفت، آشغال‌ها رو بردی دم در }
  - { n: 3, en: 'You saw her missed call and called right back', fa: 'تا دیدی میس‌کال داده، سریع بهش زنگ زدی' }
  - { n: 8, en: You tidied the whole house before the guests arrived, fa: قبل از اومدن مهمون‌ها کل خونه رو مرتب کردی }
  - { n: 4, en: You came home with hot fresh sangak bread, fa: با نون سنگک داغ اومدی خونه }
  - { n: 3, en: You ate yesterday's leftovers without complaining, fa: غذای مونده‌ی دیروز رو بی‌غر خوردی }
  - { n: 5, en: You told her her food beats any restaurant, fa: گفتی غذاش از هر رستورانی خوشمزه‌تره }
  - { n: 4, en: You taught her how to send a voice message, fa: یادش دادی چطوری ویس بفرسته }
  - { n: 2, en: You went to bed early like she told you to, fa: همون‌طور که گفت زود خوابیدی }
  - { n: 2, en: You ate every slice of the fruit she peeled for you, fa: میوه‌ای که برات پوست کنده بود رو تا ته خوردی }
  - { n: 3, en: You stood up when the elders walked in, fa: وقتی بزرگ‌ترها اومدن جلوشون پا شدی }
  - { n: 7, en: You bought her flowers for no reason at all, fa: بی‌مناسبت براش گل خریدی }
  - { n: 4, en: You said hello to every single auntie at the party, fa: تو مهمونی با تک‌تک خاله‌ها و عمه‌ها سلام‌علیک کردی }
  - { n: 1, en: You lined the shoes up neatly by the door, fa: کفش‌ها رو دم در مرتب جفت کردی }
  - { n: 1, en: You turned off the lights in the empty rooms, fa: چراغ اتاق‌های خالی رو خاموش کردی }
  - { n: 4, en: 'You took all the food she packed and didn''t say "it''s too much"', fa: همه‌ی غذایی که برات گذاشته بود ببری رو بردی و نگفتی «زیاده» }
  - { n: 5, en: You asked if her back pain is any better, fa: پرسیدی کمردردش بهتر شده یا نه }
  - { n: 6, en: You listened to the whole saga about the upstairs neighbors, fa: کل ماجرای همسایه‌ی طبقه‌ی بالا رو تا آخر گوش دادی }
  - { n: 3, en: You hung the laundry out to dry, fa: لباس‌ها رو پهن کردی }
  - { n: 5, en: You did the grocery run and forgot nothing, fa: رفتی خرید و هیچی یادت نرفت }
  - { n: 9, en: You brought home a good report card, fa: کارنامه‌ی خوب آوردی خونه }
  - { n: 3, en: You spread the sofreh before she even called you, fa: قبل از اینکه صدات کنه سفره رو انداختی }
  - { n: 3, en: You got a haircut before the family party, fa: قبل از مهمونی فامیلی رفتی موهات رو کوتاه کردی }
  - { n: 3, en: 'You walked in saying "mmm, what a smell!" before you even knew what she''d cooked', fa: 'تا اومدی تو گفتی «به‌به، چه بویی!»، قبل از اینکه بدونی چی پخته' }
  - { n: 5, en: 'You fixed her phone without saying "it''s so easy"', fa: 'گوشیش رو درست کردی و نگفتی «این که خیلی راحته»' }
  - { n: 7, en: 'In front of the aunts you said "my mom''s cooking is the best"', fa: 'جلوی خاله‌ها گفتی «دست‌پخت مامانم از همه بهتره»' }
  - { n: 4, en: 'You asked about her TV series and she happily explained it for ten minutes', fa: 'درباره‌ی سریالش ازش سؤال پرسیدی و ده دقیقه با ذوق برات تعریف کرد' }
  - { n: 5, en: 'You drove her to your aunt''s without a single complaint', fa: 'بی‌غر رسوندیش خونه‌ی خاله' }

losses:
  - { n: -3, en: 'You said "I''m not hungry"', fa: گفتی «گشنه‌م نیست» }
  - { n: -4, en: Your phone was on silent and you missed her calls, fa: گوشیت سایلنت بود و جواب زنگ‌هاش رو ندادی }
  - { n: -2, en: You went out with wet hair, fa: با موی خیس رفتی بیرون }
  - { n: -1, en: You walked around the house without socks, fa: تو خونه بی‌جوراب راه رفتی }
  - { n: -2, en: 'You said "coming!" for the third time', fa: برای بار سوم گفتی «الان میام!» }
  - { n: -3, en: Your cousin got a better grade, fa: بچه‌ی خاله‌ت نمره‌ی بهتری گرفت }
  - { n: -3, en: You forgot to take the meat out of the freezer, fa: یادت رفت گوشت رو از فریزر دربیاری }
  - { n: -2, en: You left food on your plate, fa: ته بشقابت غذا جا گذاشتی }
  - { n: -3, en: 'You opened the fridge and said "there''s nothing to eat"', fa: در یخچال رو باز کردی و گفتی «هیچی نداریم بخوریم» }
  - { n: -4, en: 'You left your dirty dishes in the sink and heard "am I your servant?"', fa: ظرف کثیفت رو ول کردی تو سینک و شنیدی «مگه من نوکرتم؟» }
  - { n: -3, en: You left her message on seen in the family group chat, fa: پیامش تو گروه فامیل رو سین کردی و جواب ندادی }
  - { n: -4, en: 'Her friend''s son became a doctor and Mom just gave you a look', fa: 'پسر دوستش دکتر شد و مامان فقط یه نگاه بهت انداخت' }
  - { n: -2, en: You gave her container back empty, fa: ظرفش رو خالی پس دادی }
  - { n: -3, en: You slept until noon, fa: تا لنگ ظهر خوابیدی }
  - { n: -1, en: You threw your clothes on the chair again, fa: باز لباس‌هات رو انداختی روی صندلی }
  - { n: -2, en: You ate chips right before dinner, fa: درست قبل شام چیپس خوردی }
  - { n: -2, en: 'You said "I''ll do it later"', fa: گفتی «بعداً انجامش می‌دم» }
  - { n: -5, en: You came home late and didn't let her know, fa: دیر اومدی خونه و خبر ندادی }
  - { n: -3, en: You were glued to your phone while the guests were over, fa: جلوی مهمون‌ها سرت تو گوشی بود }
  - { n: -2, en: 'You forgot it was your turn to take the trash out tonight', fa: 'یادت رفت امشب نوبت تو بود آشغال‌ها رو ببری' }
  - { n: -4, en: You said her rice was a little salty, fa: گفتی برنجش یه کم شوره }
  - { n: -1, en: You drank ice water right after eating, fa: درست بعد غذا آب یخ خوردی }
  - { n: -2, en: You walked across the floor she had just mopped, fa: روی زمینی که تازه طی کشیده بود راه رفتی }
  - { n: -3, en: 'She asked "how''s the food?" and you said "not bad"', fa: 'پرسید «غذا چطوره؟» گفتی «بد نیست»' }
  - { n: -4, en: 'You ate the thing she''d put aside for the guests', fa: 'همون چیزی که برای مهمونا کنار گذاشته بود رو خوردی' }
  - { n: -4, en: 'You called your aunt before you called her, and she found out', fa: 'قبل از مامان به خاله زنگ زدی و مامان فهمید' }
  - { n: -2, en: 'She said "go put on something decent" and you came back in a worse T-shirt', fa: 'گفت «برو یه چیز درست‌وحسابی بپوش» و تو با یه تی‌شرت بدتر برگشتی' }
  - { n: -2, en: 'She said "sleep early tonight" and you were the last one online in the family group', fa: 'گفت «امشب زود بخواب» و تو آخرین نفری بودی که تو گروه فامیل آنلاین بود' }

neutral:
  - { en: 'You said "whatever you think is best"', fa: گفتی «هرچی خودت صلاح می‌دونی» }
  - { en: 'She asked "have you eaten?" and you said yes', fa: پرسید «غذا خوردی؟» گفتی آره }
  - { en: 'She forwarded you an article on the dangers of phones. From her phone', fa: 'برات یه مطلب درباره‌ی ضررهای گوشی فوروارد کرد. با گوشی' }
  - { en: She asked when you're getting married. Again, fa: دوباره پرسید کِی ازدواج می‌کنی }
  - { en: 'She said "do whatever you want" in that tone', fa: با اون لحن همیشگی گفت «هرکاری دلت می‌خواد بکن» }
  - { en: 'She asked if you were cold. You weren''t. She brought a blanket anyway', fa: 'پرسید «سردته؟» گفتی نه، ولی بازم برات پتو آورد' }
  - { en: 'You said "I''m bored" and she said "great, come clean the herbs"', fa: 'گفتی «حوصله‌م سر رفته» و مامان گفت «پس بیا سبزی پاک کن»' }

# Rare events (5% of rolls) replace the normal roll with a big swing.
events:
  good:
    - { n: 30, en: She bragged about you in the family group chat, fa: تو گروه فامیل کلی ازت تعریف کرد }
    - { n: 20, en: You fixed the TV remote she'd been fighting with all week, fa: کنترل تلویزیونی که یه هفته باهاش کلنجار می‌رفت رو درست کردی }
    - { n: 25, en: You remembered her birthday without a reminder, fa: تولدش رو بدون یادآوری یادت بود }
    - { n: 45, en: You brought someone home to meet her and she adored them instantly, fa: یکی رو برای آشنایی آوردی خونه و مامان همون لحظه عاشقش شد }
    - { n: 50, en: You got into medical school and she told the whole building, fa: پزشکی قبول شدی و مامان به کل ساختمون خبر داد }
    - { n: 40, en: You took her on a surprise trip to the north, fa: سورپرایزی بردیش شمال }
    - { n: 35, en: You cooked a whole ghormeh sabzi and she asked for your recipe, fa: یه قورمه‌سبزی کامل پختی و مامان ازت دستور پختش رو خواست }
    - { n: 30, en: Grandma told everyone what a great kid she raised, fa: مامان‌بزرگ جلوی همه گفت عجب بچه‌ای بزرگ کرده }
    - { n: 25, en: 'You overheard her tell your aunt "my kid was wonderful today"', fa: 'از پشت در شنیدی به خاله گفت «بچه‌م امروز خیلی خوب بود»' }
    - { n: 30, en: 'She said "you shouldn''t have" and didn''t let go of your gift all night', fa: 'گفت «لازم نبود» و تا آخر شب کادوت رو از خودش جدا نکرد' }
  bad:
    - { n: -35, en: The slipper flew, fa: دمپایی پرواز کرد }
    - { n: -30, en: She heard the news from someone else first, fa: خبر رو اول از یکی دیگه شنید }
    - { n: -25, en: 'You said "but my friend''s mom lets them"', fa: گفتی «ولی مامانِ دوستم اجازه می‌ده» }
    - { n: -45, en: You broke one of the good guest plates from her dowry, fa: یکی از ظرف‌های جهیزیه‌ش رو شکستی }
    - { n: -40, en: She found out you threw away her Tupperware, fa: فهمید ظرفش رو انداختی دور }
    - { n: -50, en: You forgot Mother's Day, fa: روز مادر یادت رفت }
    - { n: -40, en: You said your aunt's tahdig is better than hers, fa: گفتی ته‌دیگِ خاله از ته‌دیگِ مامان بهتره }
    - { n: -20, en: The guests opened your bedroom door, fa: مهمون‌ها در اتاقت رو باز کردن }
    - { n: -20, en: 'You said "Mom, I need to tell you something" and she said "what did you break this time?"', fa: 'گفتی «مامان، یه چیزی می‌خوام بگم» و جواب داد «باز چی رو شکستی؟»' }
    - { n: -45, en: 'You forgot her birthday and posted "happy birthday" in the family group at midnight', fa: 'تولدش یادت رفت و نصف‌شب تو گروه فامیل نوشتی «تولدت مبارک»' }

# Each title is reached once the score is at least `at`.
titles:
  - { at: 0, name: { en: The other child 🙃, fa: اون یکی بچه 🙃 } }
  - { at: 25, name: { en: Sometimes useful 🧹, fa: گاهی به‌دردبخور 🧹 } }
  - { at: 60, name: { en: Good kid 🙂, fa: بچه‌ی خوب 🙂 } }
  - { at: 120, name: { en: Mom's sous-chef 🍲, fa: دستیار آشپزخونه‌ی مامان 🍲 } }
  - { at: 200, name: { en: Bragged about at every party 🗣️, fa: مایه‌ی پز مهمونی‌ها 🗣️ } }
  - { at: 350, name: { en: Golden child ✨, fa: بچه‌ی طلایی ✨ } }
  - { at: 600, name: { en: Mom's favorite 👑, fa: عزیزدردونه‌ی مامان 👑 } }

# Leaderboard nicknames by position in the group (#1, #2, ...), and one for last place.
nicknames:
  ranks:
    - { en: 'Officially the favorite 👑', fa: 'بچه‌ی محبوب، رسماً 👑' }
    - { en: 'Second, as always', fa: 'دومی، مثل همیشه' }
    - { en: 'Pride of the family', fa: 'مایه‌ی آبروی فامیل' }
    - { en: 'The obedient one', fa: 'بچه‌ی حرف‌گوش‌کن' }
    - { en: 'In charge of the dishes', fa: 'مسئول ظرف‌ها' }
    - { en: 'Herb-cleaning assistant', fa: 'دستیار سبزی پاک کردن' }
    - { en: 'The middle child', fa: 'بچه‌ی وسطی' }
    - { en: 'The "coming in a minute" one', fa: 'بچه‌ی «الان میام»' }
    - { en: 'Gets "when are you getting married?"', fa: 'همونی که ازش می‌پرسن «کِی ازدواج می‌کنی؟»' }
    - { en: 'The neighbor''s kid is better', fa: 'بچه‌ی همسایه ازش بهتره' }
  last: { en: 'Main slipper target', fa: 'هدف اصلی دمپایی' }
